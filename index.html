<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>深淵檔案：紅色警戒</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            background-color: #050000; overflow: hidden;
            font-family: 'Noto Serif TC', serif;
            cursor: none; user-select: none; -webkit-user-select: none;
            /* 建立 3D 空間，讓文字能從深處衝向鏡頭 */
            perspective: 800px;
        }

        /* 躁點材質 */
        .grain {
            position: fixed; inset: 0;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAADsEZWCAAAAGFBMVEUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtP38+AAAACXBIWXMAAA7EAAAOxAGVKw4bAAAAJklEQVQ4y2NgGAWjYBSMglEwCkbBKBgFo2AUjIJRMApGwSgYBaNgFAwAAwB7AQABK5Sj1AAAAABJRU5ErkJggg==');
            opacity: 0.15; pointer-events: none; z-index: 999;
            animation: grainShift 0.2s steps(2) infinite;
        }
        @keyframes grainShift { 0% { background-position: 0 0; } 100% { background-position: 10px 10px; } }

        /* 啟動畫面 */
        #init-screen {
            position: fixed; inset: 0; z-index: 2000; background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #ff3333; cursor: pointer; transition: opacity 1s ease;
        }
        .fade-out { opacity: 0; pointer-events: none; }

        /* 警報紅光閃爍層 */
        #alarm-overlay {
            position: fixed; inset: 0; z-index: 900; pointer-events: none;
            background: radial-gradient(circle at center, transparent 0%, rgba(255, 0, 0, 0.4) 100%);
            opacity: 0; mix-blend-mode: multiply; transition: opacity 0.2s;
        }
        .alarm-active #alarm-overlay {
            animation: sirenFlash 1.5s infinite alternate;
        }
        @keyframes sirenFlash {
            0% { opacity: 0.2; background: rgba(255, 0, 0, 0.1); }
            100% { opacity: 1; background: rgba(255, 0, 0, 0.5); }
        }

        /* 投影文字容器 */
        #projection-layer {
            position: absolute; inset: 0; z-index: 10; pointer-events: none;
            display: flex; justify-content: center; align-items: center;
            transform-style: preserve-3d;
        }

        /* 混亂文字基礎設定 */
        .chaos-text {
            position: absolute; 
            text-align: center; font-weight: 900; 
            /* 修復切邊問題：允許自然換行，並增加 padding 容納發光效果 */
            white-space: pre-wrap; padding: 10vw;
            width: 100%; max-width: 90vw;
            
            /* CSS 變數由 JS 控制 */
            color: var(--text-color);
            font-size: var(--font-size);
            text-shadow: 0 0 var(--glow-spread) var(--glow-color);
            -webkit-text-stroke: var(--stroke-width) var(--stroke-color);
            z-index: var(--z-index);
            
            /* 硬體加速，防當機 */
            will-change: transform, opacity, filter;
            opacity: 0;
        }

        /* 動畫 1：從深處衝向鏡頭 (3D Rush) */
        .anim-rush {
            animation: rushForward var(--duration) cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
        }
        @keyframes rushForward {
            0% { transform: translate3d(var(--x), var(--y), -1000px) scale(0.2); opacity: 0; filter: blur(20px); }
            20% { opacity: var(--max-opacity); filter: blur(0px); }
            80% { opacity: var(--max-opacity); filter: blur(0px); }
            100% { transform: translate3d(var(--x), var(--y), 600px) scale(2); opacity: 0; filter: blur(30px); }
        }

        /* 動畫 2：巨型警告砸臉 (Face Melt - 極度壓迫) */
        .anim-facemelt {
            animation: faceMelt var(--duration) cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }
        @keyframes faceMelt {
            0% { transform: translate3d(0, 0, -500px) scale(0.5); opacity: 0; }
            10% { transform: translate3d(0, 0, 0) scale(1); opacity: 1; text-shadow: 0 0 50px #ff0000; }
            90% { transform: translate3d(0, 0, 100px) scale(1.2); opacity: 1; text-shadow: 0 0 100px #ff0000; }
            100% { transform: translate3d(0, 0, 800px) scale(3); opacity: 0; filter: blur(20px); }
        }

        /* 畫面極限撕裂特效 (Glitch) */
        .screen-glitch { animation: severeGlitch 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes severeGlitch { 
            0% { transform: translate(0) skew(0deg); filter: none; }
            20% { transform: translate(-20px, 10px) skew(5deg) scale(1.05); filter: drop-shadow(30px 0 0 rgba(255,0,0,1)) drop-shadow(-30px 0 0 rgba(0,255,255,1)); }
            40% { transform: translate(20px, -10px) skew(-5deg) scale(1.05); filter: drop-shadow(-30px 0 0 rgba(255,0,0,1)) drop-shadow(30px 0 0 rgba(0,255,255,1)); }
            60% { transform: translate(-10px, 20px) skew(2deg) scale(1); filter: none; }
            80% { transform: translate(10px, -20px) skew(-2deg); filter: drop-shadow(20px 0 0 rgba(255,0,0,1)); }
            100% { transform: translate(0) skew(0deg); filter: none; }
        }

        /* 物理重擊閃白 */
        #strobe-layer { position: fixed; inset: 0; z-index: 2000; background: #FFF; opacity: 0; pointer-events: none; mix-blend-mode: difference; }
        .strobe-flash { animation: strobe 0.2s ease-out; }
        @keyframes strobe { 0% { opacity: 1; background: #FFF; } 30% { opacity: 0.8; background: #FF0000; } 100% { opacity: 0; } }

        /* 掃描線與暗角 */
        .scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 998; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.5)); background-size: 100% 6px; opacity: 0.7; }
        
    </style>
</head>
<body>

    <div class="grain"></div>
    <div class="scanlines"></div>
    <div id="alarm-overlay"></div>
    <div id="strobe-layer"></div>

    <div id="init-screen">
        <h1 class="text-4xl md:text-6xl font-bold tracking-[0.2em] mb-4 text-center">
            [系統失效]
        </h1>
        <p class="text-sm md:text-lg tracking-widest mt-6 text-center leading-loose">
            警告：模因實體已突破收容<br>
            <span class="animate-pulse text-white mt-4 inline-block border border-red-500 px-6 py-2">CLICK TO INITIATE LOCKDOWN</span>
        </p>
    </div>

    <!-- 投影文字層 -->
    <div id="projection-layer"></div>

    <script>
        const initScreen = document.getElementById('init-screen');
        const projectionLayer = document.getElementById('projection-layer');

        const memoryFragments = [
            "警告：模因污染擴散",
            "我們出不去了",
            "你以為你只是在看螢幕嗎？",
            "不要回頭",
            "它在你的大腦裡產卵",
            "[資料損毀]",
            "滴答，滴答... 那天晚上的聲音",
            "心跳聲不是你的",
            "閉上眼睛也沒用",
            "它們喜歡看著你恐懼的樣子",
            "呼吸。不要呼吸。",
            "系統過載 // SYSTEM OVERLOAD",
            "為什麼這次鬼當了那麼久"
        ];

        let audioCtx, droneGain, sirenOsc, sirenGain, heartbeatOsc, heartbeatGain;
        let isProjecting = false;
        let isAlarmHigh = false; // 是否處於高壓警報狀態

        // 極限視覺撕裂
        function triggerGlitch() {
            document.body.classList.remove('screen-glitch');
            void document.body.offsetWidth;
            document.body.classList.add('screen-glitch');
        }

        // 物理重擊閃白
        function playThump() {
            if(!audioCtx) return;
            const now = audioCtx.currentTime;
            
            // 聲音重擊
            const osc = audioCtx.createOscillator(); osc.type = 'sine';
            osc.frequency.setValueAtTime(80, now);
            osc.frequency.exponentialRampToValueAtTime(10, now + 1);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 2);

            // 視覺閃白
            const strobe = document.getElementById('strobe-layer');
            strobe.classList.remove('strobe-flash');
            void strobe.offsetWidth;
            strobe.classList.add('strobe-flash');
        }

        // 初始化音效系統 (警報與心跳)
        function initAudio() {
            if(audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // 底層嗡嗡聲
            const droneOsc = audioCtx.createOscillator();
            droneOsc.type = 'sawtooth'; droneOsc.frequency.value = 30; 
            droneGain = audioCtx.createGain(); droneGain.gain.value = 0.5;
            droneOsc.connect(droneGain).connect(audioCtx.destination);
            droneOsc.start();

            // 心跳聲 (重低音)
            heartbeatOsc = audioCtx.createOscillator();
            heartbeatOsc.type = 'sine'; heartbeatOsc.frequency.value = 50;
            heartbeatGain = audioCtx.createGain(); heartbeatGain.gain.value = 0;
            heartbeatOsc.connect(heartbeatGain).connect(audioCtx.destination);
            heartbeatOsc.start();

            setInterval(() => {
                if(!isProjecting) return;
                const now = audioCtx.currentTime;
                // 心跳節奏隨警報狀態變快
                const speed = isAlarmHigh ? 0.3 : 0.6;
                heartbeatOsc.frequency.setValueAtTime(70, now);
                heartbeatOsc.frequency.exponentialRampToValueAtTime(20, now + speed);
                heartbeatGain.gain.setValueAtTime(0, now);
                heartbeatGain.gain.linearRampToValueAtTime(2, now + 0.1);
                heartbeatGain.gain.exponentialRampToValueAtTime(0.01, now + speed + 0.2);
            }, isAlarmHigh ? 800 : 1500);

            // 刺耳警報聲 (Siren)
            sirenOsc = audioCtx.createOscillator();
            sirenOsc.type = 'square'; sirenOsc.frequency.value = 400;
            sirenGain = audioCtx.createGain(); sirenGain.gain.value = 0;
            
            const sirenFilter = audioCtx.createBiquadFilter();
            sirenFilter.type = 'bandpass'; sirenFilter.frequency.value = 1000;
            sirenFilter.Q.value = 5;
            
            sirenOsc.connect(sirenFilter).connect(sirenGain).connect(audioCtx.destination);
            sirenOsc.start();

            // 控制警報聲的起伏
            setInterval(() => {
                if(!isProjecting) return;
                const now = audioCtx.currentTime;
                if(isAlarmHigh) {
                    // 高壓狀態：急促的高頻警報
                    sirenGain.gain.setTargetAtTime(0.4, now, 0.1);
                    sirenOsc.frequency.setValueAtTime(800, now);
                    sirenOsc.frequency.linearRampToValueAtTime(1200, now + 0.5);
                    sirenOsc.frequency.linearRampToValueAtTime(800, now + 1);
                } else {
                    // 低壓狀態：遠處低沉的哀鳴
                    sirenGain.gain.setTargetAtTime(0.1, now, 1);
                    sirenOsc.frequency.setValueAtTime(300, now);
                    sirenOsc.frequency.linearRampToValueAtTime(400, now + 2);
                }
            }, 1000);
        }

        // 隨機觸發高壓警報事件
        function triggerAlarmEvent() {
            isAlarmHigh = true;
            document.body.classList.add('alarm-active');
            playThump();
            triggerGlitch();

            // 瘋狂生成巨型紅字
            for(let i=0; i<3; i++) {
                setTimeout(() => spawnText(true), i * 300);
            }

            // 持續 3~5 秒後解除
            setTimeout(() => {
                isAlarmHigh = false;
                document.body.classList.remove('alarm-active');
            }, 3000 + Math.random() * 2000);
        }

        // 生成文字
        function spawnText(forceHero = false) {
            // 效能保護：如果畫面上已經有超過 8 句話，就暫停生成，防止崩潰
            if (document.querySelectorAll('.chaos-text').length > 8) return;

            const word = document.createElement('div'); 
            word.className = 'chaos-text';
            word.innerText = memoryFragments[Math.floor(Math.random() * memoryFragments.length)];
            
            const isHero = forceHero || (isAlarmHigh && Math.random() > 0.3) || (!isAlarmHigh && Math.random() > 0.85);

            if (isHero) {
                // 【巨型紅色警告字 - 壓迫感十足】
                word.classList.add('anim-facemelt');
                word.style.setProperty('--duration', `${2 + Math.random() * 2}s`);
                
                const fontSize = 10 + Math.random() * 8; // 巨大字體
                word.style.setProperty('--font-size', `${fontSize}vw`);
                
                // 極度鮮豔的紅色與發光邊框
                word.style.setProperty('--text-color', '#FF1111');
                word.style.setProperty('--stroke-width', '2px');
                word.style.setProperty('--stroke-color', '#FFFFFF');
                word.style.setProperty('--glow-color', 'rgba(255, 0, 0, 1)');
                word.style.setProperty('--glow-spread', '40px');
                
                word.style.setProperty('--z-index', '100');
                word.style.setProperty('--max-opacity', '1');
                
                if (Math.random() > 0.5) triggerGlitch(); // 伴隨撕裂
                if (Math.random() > 0.7) playThump();     // 伴隨重擊

            } else {
                // 【背景 3D 浮動字 - 填補空間】
                word.classList.add('anim-rush');
                
                // 隨機 X, Y 散佈，避免全擠在中間
                const x = (Math.random() - 0.5) * 80 + 'vw';
                const y = (Math.random() - 0.5) * 80 + 'vh';
                word.style.setProperty('--x', x);
                word.style.setProperty('--y', y);
                
                word.style.setProperty('--duration', `${5 + Math.random() * 5}s`);
                
                const fontSize = 3 + Math.random() * 4; 
                word.style.setProperty('--font-size', `${fontSize}vw`);
                
                word.style.setProperty('--text-color', 'rgba(255, 255, 255, 0.7)');
                word.style.setProperty('--stroke-width', '0px');
                word.style.setProperty('--glow-color', 'rgba(255, 0, 0, 0.4)');
                word.style.setProperty('--glow-spread', '15px');
                
                word.style.setProperty('--z-index', '10');
                word.style.setProperty('--max-opacity', '0.6');
            }

            projectionLayer.appendChild(word);

            // 動畫結束後自我刪除
            word.addEventListener('animationend', () => {
                if (word.parentNode) word.parentNode.removeChild(word);
            });
        }

        initScreen.addEventListener('click', () => {
            if(isProjecting) return;
            isProjecting = true;
            
            initScreen.classList.add('fade-out');
            initAudio();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            // 初始爆發
            setTimeout(() => {
                playThump();
                triggerGlitch();
                triggerAlarmEvent();
                
                // 持續生成文字的迴圈
                const runSpawner = () => {
                    spawnText();
                    // 警報時生成極快，平常生成較慢
                    const nextSpawn = isAlarmHigh ? (200 + Math.random() * 300) : (1000 + Math.random() * 1000);
                    setTimeout(runSpawner, nextSpawn);
                };
                runSpawner();

                // 隨機觸發警報事件 (每 8~15 秒一次)
                const runAlarmCycle = () => {
                    const nextAlarm = 8000 + Math.random() * 7000;
                    setTimeout(() => {
                        triggerAlarmEvent();
                        runAlarmCycle();
                    }, nextAlarm);
                };
                runAlarmCycle();

            }, 1000);
        });

    </script>
</body>
</html>
