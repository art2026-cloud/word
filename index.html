<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>深淵檔案：投影展演版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            background-color: #000; overflow: hidden;
            font-family: 'Noto Serif TC', serif;
            cursor: none; user-select: none; -webkit-user-select: none;
        }

        /* 躁點材質 - 讓黑畫面看起來不那麼死寂，有底層流動感 */
        .grain {
            position: fixed; inset: 0;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAADsEZWCAAAAGFBMVEUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtP38+AAAACXBIWXMAAA7EAAAOxAGVKw4bAAAAJklEQVQ4y2NgGAWjYBSMglEwCkbBKBgFo2AUjIJRMApGwSgYBaNgFAwAAwB7AQABK5Sj1AAAAABJRU5ErkJggg==');
            opacity: 0.12; pointer-events: none; z-index: 999;
            animation: grainShift 0.3s steps(2) infinite;
        }
        @keyframes grainShift { 0% { background-position: 0 0; } 100% { background-position: 10px 10px; } }

        /* 啟動畫面 */
        #init-screen {
            position: fixed; inset: 0; z-index: 1000; background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; cursor: pointer; transition: opacity 2s ease;
        }
        
        .fade-out { opacity: 0; pointer-events: none; }

        /* 投影文字容器 */
        #projection-layer {
            position: absolute; inset: 0; z-index: 10; pointer-events: none;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* 巨型壓迫文字的動態設定 */
        .massive-chaos-text {
            position: absolute; 
            text-align: center; font-weight: 900; 
            white-space: nowrap; mix-blend-mode: screen;
            /* 這些變數會在 JS 中隨機生成 */
            left: var(--start-x);
            font-size: var(--font-size);
            color: var(--text-color);
            -webkit-text-stroke: var(--stroke-width) var(--stroke-color);
            z-index: var(--z-index); /* 新增層級控制：區分清晰主文本與背景模糊字 */
            opacity: 0;
            animation: chaosRise var(--duration) cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
        }

        /* 文字上升與扭曲動畫 */
        @keyframes chaosRise {
            0% { 
                top: 110dvh; opacity: 0; 
                transform: translateX(-50%) scale(0.4) rotate(calc(var(--rot) * -1deg)); 
                filter: blur(15px); 
            }
            15% { 
                opacity: var(--max-opacity); 
                filter: blur(0px); 
                text-shadow: 0 0 20px var(--glow-color); 
            }
            85% { 
                opacity: var(--max-opacity); 
                transform: translateX(-50%) scale(var(--target-scale)) rotate(calc(var(--rot) * 1deg)); 
                filter: blur(0px); 
                text-shadow: 0 0 40px var(--glow-color); 
            }
            100% { 
                top: -30dvh; opacity: 0; 
                transform: translateX(-50%) scale(calc(var(--target-scale) + 0.5)) rotate(calc(var(--rot) * 2deg)); 
                filter: blur(25px); 
            }
        }

        /* 強化：極限視覺撕裂與色散 */
        .screen-glitch { animation: severeGlitch 0.35s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes severeGlitch { 
            0% { transform: translate(0) skew(0deg); filter: none; }
            20% { transform: translate(-20px, 10px) skew(3deg) scale(1.05); filter: drop-shadow(20px 0 0 rgba(255,0,0,0.9)) drop-shadow(-20px 0 0 rgba(0,255,255,0.9)); }
            40% { transform: translate(20px, -10px) skew(-3deg) scale(1.05); filter: drop-shadow(-20px 0 0 rgba(255,0,0,0.9)) drop-shadow(20px 0 0 rgba(0,255,255,0.9)); }
            60% { transform: translate(-10px, 20px) skew(1deg) scale(1); filter: none; }
            80% { transform: translate(10px, -20px) skew(-1deg); filter: drop-shadow(15px 0 0 rgba(255,0,0,0.9)); }
            100% { transform: translate(0) skew(0deg); filter: none; }
        }

        /* 新增：重擊閃頻層 (Strobe) 與 血脈動 (Blood Pulse) */
        #strobe-layer { position: fixed; inset: 0; z-index: 2000; background: #FFF; opacity: 0; pointer-events: none; mix-blend-mode: difference; }
        .strobe-flash { animation: strobe 0.15s ease-out; }
        @keyframes strobe { 0% { opacity: 1; background: #FFF; } 40% { opacity: 0.6; background: #FF0000; } 100% { opacity: 0; } }

        #blood-vignette { position: fixed; inset: 0; pointer-events: none; z-index: 996; background: radial-gradient(circle at center, transparent 20%, rgba(180, 0, 0, 0.45) 100%); opacity: 0; mix-blend-mode: multiply; transition: opacity 0.1s ease-out; }

        /* --- 沈浸感強化視覺 --- */
        .scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 998; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.4)); background-size: 100% 6px; opacity: 0.5; }
        .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 997; background: radial-gradient(circle at center, transparent 20%, rgba(20,0,0,0.95) 100%); animation: pulse-vignette 4s infinite alternate; }
        @keyframes pulse-vignette { 0% { opacity: 0.7; } 100% { opacity: 1; } }
        
        #ash-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
        .ash { position: absolute; background: rgba(200, 200, 200, 0.6); border-radius: 50%; pointer-events: none; animation: floatAsh linear forwards; filter: blur(1.5px); }
        @keyframes floatAsh { 0% { transform: translateY(110vh) scale(0.5); opacity: 0; } 20% { opacity: 0.8; } 80% { opacity: 0.6; } 100% { transform: translateY(-10vh) scale(2); opacity: 0; } }

        /* 新增動畫：深淵凝視 (從正中央緩慢放大吞噬) */
        @keyframes faceMelt {
            0% { top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.1); opacity: 0; filter: blur(20px); }
            20% { opacity: var(--max-opacity); filter: blur(0px); text-shadow: 0 0 30px var(--glow-color); }
            85% { opacity: var(--max-opacity); filter: blur(0px); text-shadow: 0 0 80px red; transform: translate(-50%, -50%) scale(var(--target-scale)); }
            100% { top: 50%; left: 50%; transform: translate(-50%, -50%) scale(calc(var(--target-scale) + 3)); opacity: 0; filter: blur(30px); }
        }

    </style>
</head>
<body>

    <div class="grain"></div>

    <!-- 掃描線與暗角邊緣 -->
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div id="blood-vignette"></div> <!-- 新增血紅脈動 -->
    <div id="strobe-layer"></div> <!-- 新增閃頻層 -->

    <div id="init-screen">
        <h1 class="text-3xl tracking-[0.8em] mb-4 text-[#EAE6DF] font-light">啟動投影列陣</h1>
        <p class="text-sm tracking-widest text-gray-500 mt-6 px-10 text-center leading-loose">CLICK TO INITIATE PROJECTION<br>請連接外部音響系統</p>
    </div>

    <!-- 漂浮灰燼層 -->
    <div id="ash-layer"></div>

    <!-- 投影文字將會不斷生成在此層 -->
    <div id="projection-layer"></div>

    <script>
        const initScreen = document.getElementById('init-screen');
        const projectionLayer = document.getElementById('projection-layer');

        // 記憶碎片庫
        const memoryFragments = [
            "滴答，滴答... 聽起來好像那天晚上的聲音",
            "因為鞋子是要穿著跑的",
            "跑的時候，顏色就不會被炸碎",
            "如果在天花板畫上天空",
            "我們是不是就可以出去了",
            "大人說，只要不出聲，怪物就找不到我們",
            "就算很安靜的時候",
            "我還是能聽見那種嗡嗡的尖叫聲",
            "每一張上面都寫著回家的路",
            "但我好像忘記家長什麼樣子了",
            "地下室哪有星星呢",
            "只有偶爾震動落下的灰塵",
            "為什麼這次鬼當了那麼久",
            "還不說找到你了",
            "飛過去的黑鳥掉下了會爆炸的蛋",
            "沒有門，壞人進不來",
            "但我們，好像也出不去了",
            "那是那天媽媽給我的",
            "最後一顆糖果的味道",
            "外套上還有爸爸的味道",
            "假裝爸爸還在",
            "不要看，看了晚上會做惡夢哦"
        ];

        let audioCtx, droneGain, sirenOsc, sirenGain, heartbeatOsc, heartbeatGain;
        let tinnitusOsc, tinnitusGain; // 新增：潛意識耳鳴
        let spawnInterval;
        let isProjecting = false;
        let globalTension = 1.0; 
        let isVoiding = false; // 新增：黑洞狀態標記

        // 瞬間感官剝奪：系統深淵黑洞 (The Void)
        function triggerVoidEvent() {
            if(!isProjecting || isVoiding) return;
            isVoiding = true;
            
            // 1. 聲音瞬間被抽乾
            const now = audioCtx.currentTime;
            droneGain.gain.setTargetAtTime(0, now, 0.02);
            sirenGain.gain.setTargetAtTime(0, now, 0.02);
            heartbeatGain.gain.setTargetAtTime(0, now, 0.02);
            if(tinnitusGain) tinnitusGain.gain.setTargetAtTime(0, now, 0.02);

            // 2. 視覺瞬間全黑 (假裝系統壞掉)
            projectionLayer.style.display = 'none';
            document.getElementById('ash-layer').style.display = 'none';
            document.querySelector('.scanlines').style.opacity = '0';

            // 3. 窒息等待 2.5 ~ 4.5 秒，然後給予毀滅性打擊
            setTimeout(() => {
                isVoiding = false;
                globalTension = 2.5; // 復甦後進入極度狂暴
                
                projectionLayer.style.display = 'flex';
                document.getElementById('ash-layer').style.display = 'block';
                document.querySelector('.scanlines').style.opacity = '0.5';

                playThump(); // 巨響重擊閃白
                triggerGlitch(); // 畫面極限撕裂
                
                // 聲音以超高壓狀態瞬間炸回
                const resumeTime = audioCtx.currentTime;
                droneGain.gain.setTargetAtTime(1.5, resumeTime, 0.1);
                sirenOsc.frequency.setValueAtTime(1500, resumeTime);
                sirenGain.gain.setTargetAtTime(0.5, resumeTime, 0.1);

            }, 2500 + Math.random() * 2000);
        }

        // 產生環境灰燼粒子
        function spawnAsh() {
            if(!isProjecting) return;
            const ash = document.createElement('div');
            ash.className = 'ash';
            const size = Math.random() * 4 + 1;
            ash.style.width = `${size}px`; ash.style.height = `${size}px`;
            ash.style.left = `${Math.random() * 100}vw`;
            const duration = 10 + Math.random() * 15;
            ash.style.animationDuration = `${duration}s`;
            document.getElementById('ash-layer').appendChild(ash);
            setTimeout(() => { if(ash.parentNode) ash.parentNode.removeChild(ash); }, duration * 1000);
        }

        // 極低頻重擊音效與閃頻視覺
        function playThump() {
            if(!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator(); osc.type = 'sine';
            osc.frequency.setValueAtTime(60, now);
            osc.frequency.exponentialRampToValueAtTime(10, now + 1);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(1.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 2);

            // 觸發物理閃白 (Strobe) 震撼全場
            const strobe = document.getElementById('strobe-layer');
            strobe.classList.remove('strobe-flash');
            void strobe.offsetWidth;
            strobe.classList.add('strobe-flash');
        }

        // 初始化音效系統
        function initAudio() {
            if(audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const droneOsc = audioCtx.createOscillator();
            droneOsc.type = 'sine'; droneOsc.frequency.value = 40; 
            droneGain = audioCtx.createGain(); 
            droneGain.gain.value = 0;
            droneOsc.connect(droneGain).connect(audioCtx.destination);
            droneOsc.start();
            droneGain.gain.linearRampToValueAtTime(0.8, audioCtx.currentTime + 5);

            heartbeatOsc = audioCtx.createOscillator();
            heartbeatOsc.type = 'triangle'; heartbeatOsc.frequency.value = 45;
            heartbeatGain = audioCtx.createGain(); heartbeatGain.gain.value = 0;
            const hbFilter = audioCtx.createBiquadFilter();
            hbFilter.type = 'lowpass'; hbFilter.frequency.value = 80;
            heartbeatOsc.connect(hbFilter).connect(heartbeatGain).connect(audioCtx.destination);
            heartbeatOsc.start();
            
            const bloodVignette = document.getElementById('blood-vignette');

            setInterval(() => {
                if(!isProjecting || isVoiding) return; // 黑洞時暫停心跳
                const now = audioCtx.currentTime;
                heartbeatOsc.frequency.setValueAtTime(60, now);
                heartbeatOsc.frequency.exponentialRampToValueAtTime(10, now + 0.5);
                heartbeatGain.gain.setValueAtTime(0, now);
                heartbeatGain.gain.linearRampToValueAtTime(1, now + 0.1);
                heartbeatGain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);

                // 視覺心跳同步：讓四周邊緣脈動出血紅色
                bloodVignette.style.transition = 'none';
                bloodVignette.style.opacity = '1';
                setTimeout(() => {
                    bloodVignette.style.transition = 'opacity 0.8s ease-out';
                    bloodVignette.style.opacity = '0';
                }, 80);

            }, 2000);

            // 潛意識耳鳴 (高頻焦慮音，展場必備)
            tinnitusOsc = audioCtx.createOscillator();
            tinnitusOsc.type = 'sine'; tinnitusOsc.frequency.value = 7500;
            tinnitusGain = audioCtx.createGain(); tinnitusGain.gain.value = 0;
            tinnitusOsc.connect(tinnitusGain).connect(audioCtx.destination);
            tinnitusOsc.start();

            sirenOsc = audioCtx.createOscillator();
            sirenOsc.type = 'sawtooth'; sirenOsc.frequency.value = 250;
            sirenGain = audioCtx.createGain(); sirenGain.gain.value = 0;
            const sirenFilter = audioCtx.createBiquadFilter();
            sirenFilter.type = 'bandpass'; sirenFilter.frequency.value = 800;
            sirenFilter.Q.value = 2; 
            sirenOsc.connect(sirenFilter).connect(sirenGain).connect(audioCtx.destination);
            sirenOsc.start();
            sirenGain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 10);
            
            setInterval(() => {
                if(!isProjecting) return;
                
                // 10% 機率觸發「感官剝奪黑洞 (The Void)」
                if (Math.random() > 0.9 && !isVoiding) {
                    triggerVoidEvent();
                    return;
                }
                
                if (isVoiding) return; // 黑洞期間不進行常規音樂起伏

                const now = audioCtx.currentTime;
                globalTension = Math.random() > 0.6 ? 1.5 : 0.6; 
                sirenOsc.frequency.exponentialRampToValueAtTime(600 * globalTension, now + 4);
                sirenOsc.frequency.exponentialRampToValueAtTime(250, now + 8);
                droneGain.gain.linearRampToValueAtTime(0.8 * globalTension, now + 2);

                // 耳鳴音量隨壓迫感上升 (潛意識干擾)
                tinnitusGain.gain.setTargetAtTime(globalTension > 1 ? 0.05 : 0, now, 2);
            }, 8000);
        }

        function triggerGlitch() {
            document.body.classList.remove('screen-glitch');
            void document.body.offsetWidth;
            document.body.classList.add('screen-glitch');
        }

        // 生成巨型文字
        function spawnMassiveText() {
            const word = document.createElement('div'); 
            word.className = 'massive-chaos-text';
            
            word.innerText = memoryFragments[Math.floor(Math.random() * memoryFragments.length)];
            
            // X 軸位移改為 3D 空間計算
            const offsetX = (Math.random() - 0.5) * 80 + 'vw'; 
            word.style.setProperty('--offset-x', offsetX);
            
            const rot = (Math.random() * 10 - 5);
            word.style.setProperty('--rot', rot);
            
            const isFaceMelt = Math.random() > 0.9;
            word.style.animationName = isFaceMelt ? 'faceMelt' : 'chaosRise';
            if(isFaceMelt) playThump(); 

            // 在高壓狀態下(Tension > 1)，背景的不穩定性增加，更容易觸發全場畫面撕裂
            if (globalTension > 1 && Math.random() > 0.7) triggerGlitch();

            // 主從文字層級控制
            const isHeroText = Math.random() > 0.5; // 提高主文比例
            let duration;

            if (isFaceMelt) {
                // 【終極壓迫：深淵凝視】強制覆蓋設定，絕對清晰、極度巨大、最高亮度
                word.style.setProperty('--z-index', '100');
                word.style.setProperty('--max-opacity', '1');
                
                const fontSize = 7 + Math.random() * 5; 
                word.style.setProperty('--font-size', `${fontSize}vw`);
                
                duration = 8; 
                word.style.setProperty('--duration', `${duration}s`);
                word.style.setProperty('--target-scale', `2.2`); 
                
                word.style.setProperty('--text-color', '#FF0000');
                word.style.setProperty('--stroke-width', '0px');
                word.style.setProperty('--glow-color', 'rgba(255, 0, 0, 1)');
                triggerGlitch(); 
                
            } else if (isHeroText) {
                // 【清晰主文】
                word.style.setProperty('--z-index', '50');
                word.style.setProperty('--max-opacity', '1');
                
                const fontSize = 3.5 + Math.random() * 4; 
                word.style.setProperty('--font-size', `${fontSize}vw`);
                
                duration = 10 + Math.random() * 5; 
                word.style.setProperty('--duration', `${duration}s`);
                word.style.setProperty('--target-scale', `1.1`); 
                
                if (Math.random() > 0.3) {
                    word.style.setProperty('--text-color', 'rgba(255, 255, 255, 1)');
                    word.style.setProperty('--stroke-width', '0px');
                    word.style.setProperty('--glow-color', 'rgba(255, 255, 255, 0.6)');
                } else {
                    word.style.setProperty('--text-color', '#FF3B3B');
                    word.style.setProperty('--stroke-width', '0px');
                    word.style.setProperty('--glow-color', 'rgba(255, 0, 0, 0.8)');
                }
            } else {
                // 【背景囈語】強化存在感！不再過度透明
                word.style.setProperty('--z-index', '10');
                word.style.setProperty('--max-opacity', '0.55'); // 大幅提升透明度 (原本 0.25)
                
                const fontSize = 8 + Math.random() * 10; 
                word.style.setProperty('--font-size', `${fontSize}vw`);
                
                duration = 6 + Math.random() * 4; 
                word.style.setProperty('--duration', `${duration}s`);
                word.style.setProperty('--target-scale', `1.5`); 
                
                // 填入暗血紅色，取代原本的完全透明，讓字更有厚度
                word.style.setProperty('--text-color', 'rgba(150, 20, 20, 0.3)');
                word.style.setProperty('--stroke-color', 'rgba(220, 40, 40, 0.8)');
                word.style.setProperty('--stroke-width', '2px');
                word.style.setProperty('--glow-color', 'rgba(150, 0, 0, 0.5)'); // 加上微弱的底光
            }

            projectionLayer.appendChild(word);

            setTimeout(() => {
                if (word.parentNode) {
                    word.parentNode.removeChild(word);
                }
            }, duration * 1000);
        }

        initScreen.addEventListener('click', () => {
            if(isProjecting) return;
            isProjecting = true;
            
            initScreen.classList.add('fade-out');
            initAudio();
            
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            // 啟動灰燼粒子系統
            setInterval(spawnAsh, 300);

            setTimeout(() => {
                for(let i=0; i<3; i++) setTimeout(spawnMassiveText, i * 500);
                
                const runSpawner = () => {
                    // 若在黑洞狀態，暫停生成新文字
                    if (!isVoiding) spawnMassiveText();
                    
                    const nextSpawn = (1500 + Math.random() * 1000) / globalTension;
                    spawnInterval = setTimeout(runSpawner, nextSpawn);
                };
                runSpawner();

            }, 2000);
        });

    </script>
</body>
</html>
